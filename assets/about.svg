<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="About me: System design. Designing services that stay reliable, scalable and maintainable as they grow. Architecture. How to structure services, model data and handle load without things falling apart. Performance. Performance optimization, clean code and tradeoff-driven decisions over clever hacks. Always learning. Going deeper on distributed systems, language internals and observability. AI solutions. Integrating LLMs and AI agents into backend systems, and building faster with AI tooling. Let's talk. Happy to talk architecture, scaling and the &quot;why&quot; behind design choices anytime."><title>About me: System design. Designing services that stay reliable, scalable and maintainable as they grow. Architecture. How to structure services, model data and handle load without things falling apart. Performance. Performance optimization, clean code and tradeoff-driven decisions over clever hacks. Always learning. Going deeper on distributed systems, language internals and observability. AI solutions. Integrating LLMs and AI agents into backend systems, and building faster with AI tooling. Let's talk. Happy to talk architecture, scaling and the &quot;why&quot; behind design choices anytime.</title><style>.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.t1{animation:tw 3.1s ease-in-out infinite}
.t2{animation:tw 4.3s ease-in-out -1.2s infinite}
.t3{animation:tw 5.7s ease-in-out -2.6s infinite}
.t4{animation:tw 7.3s ease-in-out -.7s infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.p1{animation:pulse 3.6s ease-in-out infinite}
.p2{animation:pulse 4.8s ease-in-out -1.5s infinite}
.p3{animation:pulse 6s ease-in-out -3s infinite}
@keyframes flow{to{stroke-dashoffset:-48}}
.flow{animation:flow 3s linear infinite}
@keyframes shoot{0%{transform:translateX(0);opacity:0}1.5%{opacity:1}7%{transform:translateX(480px);opacity:0}100%{transform:translateX(480px);opacity:0}}
.s1{animation:shoot 9s linear infinite}
.s2{animation:shoot 13s linear -4s infinite}
.s3{animation:shoot 17s linear -9s infinite}
