s="mono" font-size="11.5" letter-spacing="3" fill="#67e8f9">MISSION LOG // 01</text><text x="56" y="84" class="sans" font-size="27" font-weight="700" fill="#eef1ff">About me</text><g transform="translate(792 74) rotate(-18)"><ellipse rx="58" ry="13" fill="none" stroke="#c9b8ff" stroke-opacity=".35" stroke-width="5"/><circle r="30" fill="url(#planet)"/><path d="M-58,0A58,13 0 0 0 58,0" fill="none" stroke="#e6dcff" stroke-opacity=".75" stroke-width="5"/></g><polyline points="66,140 50,236 72,332" fill="none" stroke="#9aa4ff" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="2 6" stroke-linecap="round" class="flow"/><g transform="translate(66 140)"><circle r="15.3" fill="#ffc56b" opacity=".16" class="p1"/><path d="M0,-9Q1.3,-1.3 9,0Q1.3,1.3 0,9Q-1.3,1.3 -9,0Q-1.3,-1.3 0,-9Z" fill="#ffc56b"/><circle r="2" fill="#fff"/></g><text x="98" y="146" class="sans" font-size="16.5" font-weight="650" fill="#eef1ff">System design</text><text x="98" y="169" class="mono" font-size="12.3" fill="#a3acd9">Designing services that stay reliable,</text><text x="98" y="187" class="mono" font-size="12.3" fill="#a3acd9">scalable and maintainable as they grow.</text><g transform="translate(50 236)"><circle r="15.3" fill="#ff8fd0" opacity=".16" class="p2"/><path d="M0,-9Q1.3,-1.3 9,0Q1.3,1.3 0,9Q-1.3,1.3 -9,0Q-1.3,-1.3 0,-9Z" fill="#ff8fd0"/><circle r="2" fill="#fff"/></g><text x="98" y="242" class="sans" font-size="16.5" font-weight="650" fill="#eef1ff">Architecture</text><text x="98" y="265" class="mono" font-size="12.3" fill="#a3acd9">How to structure services, model data and</text><text x="98" y="283" class="mono" font-size="12.3" fill="#a3acd9">handle load without things falling apart.</text><g transform="translate(72 332)"><circle r="15.3" fill="#b79bff" opacity=".16" class="p3"/><path d="M0,-9Q1.3,-1.3 9,0Q1.3,1.3 0,9Q-1.3,1.3 -9,0Q-1.3,-1.3 0,-9Z" fill="#b79bff"/><circle r="2" fill="#fff"/></g><text x="98" y="338" class="sans" font-size="16.5" font-weight="650" fill="#eef1ff">Performance</text><text x="98" y="361" class="mono" font-size="12.3" fill="#a3acd9">Performance optimization, clean code and</text><text x="98" y="379" class="mono" font-size="12.3" fill="#a3acd9">tradeoff-driven decisions over clever hacks.</text><polyline points="480,140 464,236 486,332" fill="none" stroke="#9aa4ff" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="2 6" stroke-linecap="round" class="flow"/><g transform="translate(480 140)"><circle r="15.3" fill="#7aa8ff" opacity=".16" class="p2"/><path d="M0,-9Q1.3,-1.3 9,0Q1.3,1.3 0,9Q-1.3,1.3 -9,0Q-1.3,-1.3 0,-9Z" fill="#7aa8ff"/><circle r="2" fill="#fff"/></g><text x="512" y="146" class="sans" font-size="16.5" font-weight="650" fill="#eef1ff">Always learning</text><text x="512" y="169" class="mono" font-size="12.3" fill="#a3acd9">Going deeper on distributed systems,</text><text x="512" y="187" class="mono" font-size="12.3" fill="#a3acd9">language internals and observability.</text><g transform="translate(464 236)"><circle r="15.3" fill="#67e8f9" opacity=".16" class="p3"/><path d="M0,-9Q1.3,-1.3 9,0Q1.3,1.3 0,9Q-1.3,1.3 -9,0Q-1.3,-1.3 0,-9Z" fill="#67e8f9"/><circle r="2" fill="#fff"/></g><text x="512" y="242" class="sans" font-size="16.5" font-weight="650" fill="#eef1ff">AI solutions</text><text x="512" y="265" class="mono" font-size="12.3" fill="#a3acd9">Integrating LLMs and AI agents into backend</text><text x="512" y="283" class="mono" font-size="12.3" fill="#a3acd9">systems, and building faster with AI</text><text x="512" y="301" class="mono" font-size="12.3" fill="#a3acd9">tooling.</text><g transform="translate(486 332)"><circle r="15.3" fill="#7ef0c2" opacity=".16" class="p1"/><path d="M0,-9Q1.3,-1.3 9,0Q1.3,1.3 0,9Q-1.3,1.3 -9,0Q-1.3,-1.3 0,-9Z" fill="#7ef0c2"/><circle r="2" fill="#fff"/></g><text x="512" y="338" class="sans" font-size="16.5" font-weight="650" fill="#eef1ff">Let's talk</text><text x="512" y="361" class="mono" font-size="12.3" fill="#a3acd9">Happy to talk architecture, scaling and the</text><text x="512" y="379" class="mono" font-size="12.3" fill="#a3acd9">&quot;why&quot; behind design choices anytime.</text></g><rect x=".5" y=".5" width="879" height="419" rx="17.5" fill="none" stroke="#8b93ff" stroke-opacity=".25"/></svg>